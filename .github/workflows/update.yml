name: nuLiga-Daten aktualisieren
on:
  schedule:
    - cron: "*/30 * * * *"   # alle 30 Minuten
  workflow_dispatch: {}      # zusaetzlich per Knopfdruck
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_nuliga.py
        env:
          SEND_REMINDERS: "1"
      - run: |
          git config user.name "lsv-bot"
          git config user.email "lsv-bot@users.noreply.github.com"
          git add data.json notified.json kalender
          git diff --cached --quiet || (git commit -m "nuLiga-Daten aktualisiert" && git push)
